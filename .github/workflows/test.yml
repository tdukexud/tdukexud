name: C++ Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Compile C++ code
        run: g++ -o test test.cpp
      - name: Run C++ code
        run: ./test
      - name: Exit successfully
        run: exit 0